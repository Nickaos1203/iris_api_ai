name: Iris API AI CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ============================================================
  # 1. Préparation de l'environnement
  # ============================================================
  prepare:
    name: Préparation de l'environnement
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


  # ============================================================
  # 2. Validation du modèle
  # ============================================================
  validate-model:
    name: Validation du modèle
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validation du modèle Iris
        run: |
          python src/pipeline_model.py


  # ============================================================
  # 3. Tests automatisés
  # ============================================================
  tests:
    name: Tests automatisés
    needs: validate-model
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution des tests
        run: |
          pytest -v


  # ============================================================
  # 4. Test Docker - environnement de développement
  # ============================================================
  docker-dev:
    name: Test Docker - Développement
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Vérification Docker
        run: |
          docker --version
          docker compose version

      - name: Construction des conteneurs
        run: |
          docker compose build

      - name: Démarrage de la stack
        run: |
          docker compose up -d

      - name: Vérification des conteneurs
        run: |
          docker compose ps

      - name: Attente du démarrage de l'API
        run: |
          sleep 10

      - name: Vérification de l'API via /metrics
        run: |
          curl --fail http://localhost:8000/metrics

      - name: Arrêt de la stack
        if: always()
        run: |
          docker compose down


  # ============================================================
  # 5. Test Docker - environnement de production
  # ============================================================
  docker-production:
    name: Test Docker - Production
    needs: docker-dev
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Vérification Docker
        run: |
          docker --version
          docker compose version

      - name: Construction de la stack Render
        run: |
          docker compose -f docker-compose.render.yml build

      - name: Démarrage de la stack Render
        run: |
          docker compose -f docker-compose.render.yml up -d

      - name: Vérification des conteneurs
        run: |
          docker compose -f docker-compose.render.yml ps

      - name: Attente du démarrage de l'API
        run: |
          sleep 10

      - name: Vérification de l'API via /metrics
        run: |
          curl --fail http://localhost:8000/metrics

      - name: Arrêt de la stack Render
        if: always()
        run: |
          docker compose -f docker-compose.render.yml down


