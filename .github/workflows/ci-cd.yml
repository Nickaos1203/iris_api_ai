name: Iris MLOps CI/CD

# ==========================================
# Étape 1 : Déclenchement du pipeline
# ==========================================
on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop


jobs:

  # ==========================================
  # Étape 2 : Préparation de l'environnement
  # ==========================================
  prepare:
    name: Préparation de l'environnement
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


  # ==========================================
  # Étape 3 : Validation du modèle
  # ==========================================
  validate-model:
    name: Validation du modèle
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validation du modèle
        run: |
          python src/pipeline_model.py


  # ==========================================
  # Étape 4 : Tests automatisés
  # ==========================================
  tests:
    name: Tests automatisés
    needs: validate-model
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution des tests
        run: |
          pytest -v


  # ==========================================
  # Étape 5 : Docker Compose
  # ==========================================
  docker-compose:
    name: Docker Compose
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Construction des images
        run: |
          docker compose build

      - name: Lancement des services
        run: |
          docker compose up -d

      - name: Vérification des conteneurs
        run: |
          docker compose ps

      - name: Vérification de l'API
        run: |
          sleep 10
          curl --fail http://localhost:8000/health

      - name: Arrêt des services
        if: always()
        run: |
          docker compose down