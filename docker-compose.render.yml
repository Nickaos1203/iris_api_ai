services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api.render
    environment:
      - PORT=10000
    ports:
      - "8000:10000"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit.render
    environment:
      - PORT=10000
      - API_URL=http://api:10000
    ports:
      - "8501:10000"
    depends_on:
      - api

  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus.render
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana.render
    ports:
      - "3000:3000"
    depends_on:
      - prometheus